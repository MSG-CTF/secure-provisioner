name: Verify Provisioner

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provisioner
          POSTGRES_PASSWORD: provisioner_test_only
          POSTGRES_DB: provisioner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provisioner -d provisioner_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PROVISIONER_TEST_DATABASE_URL: postgres://provisioner:provisioner_test_only@127.0.0.1:5432/provisioner_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test deployment rollback
        run: bash scripts/test-deploy-provisioner-release.sh
      - name: Test with PostgreSQL
        run: go test -p 1 ./... -count=1 -timeout 5m
      - name: Vet
        run: go vet ./...
      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o /tmp/secure-provisioner ./cmd/provisioner
