name: Verify Provisioner

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: provisioner
          POSTGRES_PASSWORD: provisioner_test_only
          POSTGRES_DB: provisioner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provisioner -d provisioner_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PROVISIONER_TEST_DATABASE_URL: postgres://provisioner:provisioner_test_only@127.0.0.1:5432/provisioner_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and deployment recovery
        run: |
          go mod verify
          go build -o "$RUNNER_TEMP/registry-validator" ./cmd/provisioner
          RUNTIME_REGISTRY_VALIDATOR="$RUNNER_TEMP/registry-validator" python3 -m unittest discover -s deploy -p 'test_*.py' -v
          bash scripts/test-deploy-provisioner-release.sh
      - name: Test with PostgreSQL and vet
        run: |
          go test -p 1 ./... -count=1 -timeout 5m
          go vet ./...
      - name: Verify Gateway controller and API contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/gateway-tests"
          "$RUNNER_TEMP/gateway-tests/bin/pip" install -r deploy/gateway/requirements-test.txt
          PYTHONPATH=deploy/gateway "$RUNNER_TEMP/gateway-tests/bin/python" -m unittest discover -s deploy/gateway/tests -v
      - name: Build the Linux release
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/artifact ./cmd/provisioner
          (cd dist && sha256sum artifact > artifact.sha256)
      - name: Verify continuous HTTP and durable queue handoff with real nginx
        env:
          RUNTIME_TEST_BINARY: ${{ github.workspace }}/dist/artifact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx
          python3 -m unittest discover -s deploy -p 'test_runtime_integration.py' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: control-production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: runtime-${{ github.sha }}
          path: dist/
      - name: Deploy the verified artifact and check authenticated API responses
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: msgctf-deploy
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          DEPLOY_SERVICE_TOKEN: ${{ secrets.DEPLOY_SERVICE_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          (cd dist && sha256sum -c artifact.sha256)
          python3 deploy/send_release.py runtime --artifact dist/artifact --source-sha "$SOURCE_SHA"
