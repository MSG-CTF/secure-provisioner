services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: provisioner
      POSTGRES_PASSWORD: provisioner
      POSTGRES_DB: provisioner_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisioner -d provisioner_test"]
      interval: 2s
      timeout: 2s
      retries: 20
