# Install only during the fully opted-in Gateway-only maintenance cutover.
[Unit]
Requires=msgctf-gateway-nodeport-firewall.service
After=msgctf-gateway-nodeport-firewall.service

[Service]
# A failed/incomplete firewall must also block restored Kubernetes NodePorts.
ExecStartPre=+/usr/bin/python3 -I /usr/local/sbin/msgctf-gateway-nodeport-firewall.py verify
