# Install only on the fully opted-in Gateway-only Runtime node.
[Unit]
Requires=msgctf-gateway-nodeport-firewall.service
After=msgctf-gateway-nodeport-firewall.service

[Service]
# The Runtime runs as provisioner. '+' runs this verification as root.
ExecStartPre=+/usr/bin/python3 -I /usr/local/sbin/msgctf-gateway-nodeport-firewall.py verify
# App shutdown may take 180 seconds. Retain the existing 240-second override.
TimeoutStopSec=240
