# Review all host paths and replace the node-name/image placeholders before use.
# This namespace is dedicated to trusted infrastructure, never challenge pods.
apiVersion: v1
kind: Namespace
metadata:
  name: runtime-image-preparation
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-agent
  namespace: runtime-image-preparation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runtime-image-agent-node-identity
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [REPLACE_NODE_NAME]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runtime-image-agent-node-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runtime-image-agent-node-identity
subjects:
  - kind: ServiceAccount
    name: image-agent
    namespace: runtime-image-preparation
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: runtime-image-agent
  namespace: runtime-image-preparation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-image-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-image-agent
    spec:
      serviceAccountName: image-agent
      nodeSelector:
        kubernetes.io/os: linux
        msgctf.io/image-preparation-agent: "true"
      containers:
        - name: agent
          image: REPLACE_WITH_REVIEWED_AGENT_IMAGE_AT_SHA256
          imagePullPolicy: IfNotPresent
          args: [--idle]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: cri, mountPath: /run/k3s/containerd/containerd.sock}
            - {name: k3s, mountPath: /host-bin/k3s, readOnly: true}
            - {name: k3s-data, mountPath: /var/lib/rancher/k3s/data, readOnly: true}
            - {name: machine-id, mountPath: /host-identity/machine-id, readOnly: true}
            - {name: boot-id, mountPath: /host-identity/boot-id, readOnly: true}
      volumes:
        - name: cri
          hostPath: {path: /run/k3s/containerd/containerd.sock, type: Socket}
        - name: k3s
          hostPath: {path: /usr/local/bin/k3s, type: File}
        - name: k3s-data
          hostPath: {path: /var/lib/rancher/k3s/data, type: Directory}
        - name: machine-id
          hostPath: {path: /etc/machine-id, type: File}
        - name: boot-id
          hostPath: {path: /proc/sys/kernel/random/boot_id, type: File}
