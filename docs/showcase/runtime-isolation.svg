<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Runtime 실행 경로와 K3s 격리</title><desc id="desc">Linux x86_64 ARM64는 아키텍처가 맞는 K3s 대상에서 실행하며 Windows는 별도 VM executor 경로를 사용합니다. 인스턴스별 Namespace와 NetworkPolicy, SecurityContext, 자원 제한을 적용합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#bd955f" stroke-width="1.5"/></marker></defs>
