<text x="30" y="349" font-size="19" font-weight="400" fill="#e0bc86" text-anchor="start">이미지와 실행 노드의 CPU 아키텍처를 맞춰 배정</text>
<rect x="30" y="378" width="290" height="130" rx="10" fill="#2b251e" stroke="#c7a46c" stroke-dasharray="6 4"/>
<text x="175" y="410" font-size="20" font-weight="600" fill="#f4ede0" text-anchor="middle">INSTANCE A</text>
