<text x="680" y="396" font-size="22" font-weight="600" fill="#f4ede0" text-anchor="start">K3s 실행 정책</text>
<text x="680" y="432" font-size="17" font-weight="400" fill="#c7bbae" text-anchor="start">기본 통신 차단 · 필요한 경로 허용</text>
