<text x="172.5" y="110" font-size="22" font-weight="600" fill="#f4ede0" text-anchor="middle">Backend / Scheduler</text>
<text x="172.5" y="139" font-size="17" font-weight="400" fill="#c7bbae" text-anchor="middle">실행 대상 · 이미지 · 환경 설정</text>
<rect x="365" y="78" width="270" height="80" rx="9" fill="#3c2d1d" stroke="#c7a46c"/>
<text x="500.0" y="110" font-size="22" font-weight="600" fill="#f4ede0" text-anchor="middle">Runtime API</text>
<text x="500.0" y="139" font-size="17" font-weight="400" fill="#c7bbae" text-anchor="middle">작업 ID · 상태 · 재시도</text>
<path d="M315 118H365" fill="none" stroke="#bd955f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="218" width="600" height="95" rx="9" fill="#3c2d1d" stroke="#c7a46c"/>
<text x="330.0" y="250" font-size="22" font-weight="600" fill="#f4ede0" text-anchor="middle">Linux / K3s</text>
<text x="330.0" y="279" font-size="17" font-weight="400" fill="#c7bbae" text-anchor="middle">x86_64 (amd64) · ARM64</text>
<rect x="680" y="218" width="290" height="95" rx="9" fill="#2b251e" stroke="#655442"/>
