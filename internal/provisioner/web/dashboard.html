<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Provisioner</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #d9dee5;
      --line-strong: #aeb7c2;
      --text: #18212b;
      --muted: #647180;
      --accent: #087e8b;
      --accent-hover: #066b76;
      --success: #147d4f;
      --warning: #9a6400;
      --danger: #b42318;
      --dark: #202933;
      --focus: #79cbd4;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    button, a.action {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.48; }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: var(--dark);
      color: #ffffff;
      border-bottom: 3px solid var(--accent);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid #7fd5de;
      border-radius: 6px;
      color: #b5f1f5;
      font-weight: 800;
    }
    .brand strong { font-size: 16px; letter-spacing: 0; white-space: nowrap; }
    .environment { color: #c7d0da; font-size: 12px; white-space: nowrap; }

    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 40px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
      background: var(--surface);
      margin-bottom: 18px;
    }

    .summary-item { min-width: 0; padding: 14px 16px; }
    .summary-item + .summary-item { border-left: 1px solid var(--line); }
    .summary-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .summary-value { display: block; font-weight: 750; overflow-wrap: anywhere; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 0.8fr) minmax(420px, 1.2fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    .panel-body { padding: 16px; }

    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--text);
      letter-spacing: 0;
    }
    input[readonly] { background: #eef1f4; color: #475463; }
    .field-note { margin-top: 5px; color: var(--muted); font-size: 12px; }

    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .primary { background: var(--accent); color: #ffffff; }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .secondary { background: #ffffff; color: var(--text); border-color: var(--line-strong); }
    .secondary:hover:not(:disabled) { background: #eef2f5; }
    .danger { background: #ffffff; color: var(--danger); border-color: #e5a8a3; }
    .danger:hover:not(:disabled) { background: #fff0ef; }
    a.action { display: inline-flex; align-items: center; text-decoration: none; background: var(--success); color: #ffffff; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      background: #f8fafb;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8994a0; }
    .status.ready { color: var(--success); border-color: #9dd5bb; background: #effaf4; }
    .status.ready::before { background: var(--success); }
    .status.running { color: var(--warning); border-color: #e7ca8a; background: #fff9ea; }
    .status.running::before { background: #d28a00; }
    .status.failed { color: var(--danger); border-color: #edb5b0; background: #fff2f1; }
    .status.failed::before { background: var(--danger); }

    .empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--muted);
      text-align: center;
    }

    .details { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .details th, .details td { padding: 10px 0; border-bottom: 1px solid #edf0f3; vertical-align: top; text-align: left; }
    .details th { width: 132px; color: var(--muted); font-weight: 650; }
    .details td { overflow-wrap: anywhere; }
    code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; background: #eef2f5; padding: 2px 5px; border-radius: 4px; }

    .activity { margin-top: 18px; }
    .log { margin: 0; min-height: 156px; max-height: 250px; overflow: auto; background: #161d25; color: #d8e0e8; padding: 14px 16px; font: 12px/1.65 "Cascadia Code", Consolas, monospace; white-space: pre-wrap; }
    .log .time { color: #8fa0b2; }
    .log .ok { color: #85e0b1; }
    .log .error { color: #ff9b93; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 820px) {
      .topbar { padding: 0 16px; }
      main { width: min(100% - 20px, 680px); margin-top: 14px; }
      .summary { grid-template-columns: 1fr; }
      .summary-item + .summary-item { border-left: 0; border-top: 1px solid var(--line); }
      .workspace { grid-template-columns: 1fr; }
      .details th { width: 110px; }
    }

    @media (max-width: 460px) {
      .environment { display: none; }
      .button-row > button, .button-row > a { width: 100%; justify-content: center; }
      .panel-body { padding: 14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">SP</div>
      <strong>Secure Provisioner</strong>
    </div>
    <span class="environment">LOCAL · XSS LAB</span>
  </header>

  <main>
    <section class="summary" aria-label="서비스 요약">
      <div class="summary-item">
        <span class="summary-label">클러스터</span>
        <span class="summary-value">k3s-local</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">문제</span>
        <span class="summary-value">xss-101 · Reflected XSS</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">API 상태</span>
        <span class="summary-value" id="apiHealth">확인 중</span>
      </div>
    </section>

    <div class="workspace">
      <section class="panel" aria-labelledby="createTitle">
        <div class="panel-header">
          <h1 id="createTitle">인스턴스 생성</h1>
        </div>
        <form class="panel-body" id="createForm">
          <div class="field">
            <label for="teamId">팀 ID</label>
            <input id="teamId" name="teamId" type="number" min="1" value="101" required>
          </div>
          <div class="field">
            <label for="challengeId">문제</label>
            <select id="challengeId" name="challengeId">
              <option value="xss-101">xss-101 · Reflected XSS</option>
            </select>
          </div>
          <div class="field">
            <label for="ttlMinutes">TTL</label>
            <input id="ttlMinutes" name="ttlMinutes" type="number" min="1" max="360" value="30" required>
            <div class="field-note">분 단위 · 최대 360분</div>
          </div>
          <div class="field">
            <label for="reservationId">예약 ID</label>
            <input id="reservationId" name="reservationId" value="rsv-local" readonly>
          </div>
          <div class="button-row">
            <button class="primary" id="createButton" type="submit">인스턴스 생성</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="instanceTitle">
        <div class="panel-header">
          <h2 id="instanceTitle">현재 인스턴스</h2>
          <span class="status" id="phaseBadge">없음</span>
        </div>
        <div class="empty" id="emptyState">생성된 인스턴스가 없습니다.</div>
        <div class="panel-body" id="instanceContent" hidden>
          <table class="details">
            <tbody>
              <tr><th>Instance ID</th><td><code id="instanceId">-</code></td></tr>
              <tr><th>Operation ID</th><td><code id="operationId">-</code></td></tr>
              <tr><th>팀</th><td id="instanceTeam">-</td></tr>
              <tr><th>문제</th><td id="instanceChallenge">-</td></tr>
              <tr><th>상태</th><td id="instancePhase">-</td></tr>
              <tr><th>만료</th><td id="instanceExpiry">-</td></tr>
              <tr><th>Endpoint</th><td id="instanceEndpoint">-</td></tr>
              <tr id="errorRow" hidden><th>오류</th><td id="instanceError">-</td></tr>
            </tbody>
          </table>
          <div class="button-row">
            <a class="action" id="openChallenge" href="#" target="_blank" rel="noopener" hidden>문제 열기</a>
            <button class="secondary" id="refreshButton" type="button">상태 조회</button>
            <button class="danger" id="deleteButton" type="button">인스턴스 삭제</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel activity" aria-labelledby="activityTitle">
      <div class="panel-header">
        <h2 id="activityTitle">API 활동</h2>
        <button class="secondary" id="clearLogButton" type="button">기록 지우기</button>
      </div>
      <pre class="log" id="activityLog" aria-live="polite"><span class="time">대기 중</span></pre>
    </section>
  </main>

  <script>
    const elements = {
      apiHealth: document.querySelector("#apiHealth"),
      createForm: document.querySelector("#createForm"),
      createButton: document.querySelector("#createButton"),
      teamId: document.querySelector("#teamId"),
      challengeId: document.querySelector("#challengeId"),
      ttlMinutes: document.querySelector("#ttlMinutes"),
      phaseBadge: document.querySelector("#phaseBadge"),
      emptyState: document.querySelector("#emptyState"),
      instanceContent: document.querySelector("#instanceContent"),
      instanceId: document.querySelector("#instanceId"),
      operationId: document.querySelector("#operationId"),
      instanceTeam: document.querySelector("#instanceTeam"),
      instanceChallenge: document.querySelector("#instanceChallenge"),
      instancePhase: document.querySelector("#instancePhase"),
      instanceExpiry: document.querySelector("#instanceExpiry"),
      instanceEndpoint: document.querySelector("#instanceEndpoint"),
      instanceError: document.querySelector("#instanceError"),
      errorRow: document.querySelector("#errorRow"),
      openChallenge: document.querySelector("#openChallenge"),
      refreshButton: document.querySelector("#refreshButton"),
      deleteButton: document.querySelector("#deleteButton"),
      activityLog: document.querySelector("#activityLog"),
      clearLogButton: document.querySelector("#clearLogButton")
    };

    const state = {
      instanceId: localStorage.getItem("provisioner.instanceId") || "",
      operationId: "",
      phase: "",
      busy: false
    };

    function id(prefix) {
      const value = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      return `${prefix}-${value}`;
    }

    function log(message, kind = "") {
      const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
      if (elements.activityLog.textContent.trim() === "대기 중") {
        elements.activityLog.textContent = "";
      }
      const line = document.createElement("div");
      const clock = document.createElement("span");
      clock.className = "time";
      clock.textContent = `[${time}] `;
      const text = document.createElement("span");
      text.className = kind;
      text.textContent = message;
      line.append(clock, text);
      elements.activityLog.prepend(line);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error?.message || `HTTP ${response.status}`);
      }
      return payload;
    }

    function setBusy(busy) {
      state.busy = busy;
      elements.createButton.disabled = busy;
      elements.deleteButton.disabled = busy || !state.instanceId || state.phase === "TERMINATED";
      elements.refreshButton.disabled = busy;
    }

    function setPhase(phase) {
      const value = phase || "없음";
      state.phase = value;
      elements.phaseBadge.textContent = value;
      elements.phaseBadge.className = "status";
      if (value === "READY" || value === "TERMINATED") elements.phaseBadge.classList.add("ready");
      if (["REQUESTED", "PROVISIONING", "VERIFYING", "TERMINATING"].includes(value)) elements.phaseBadge.classList.add("running");
      if (["FAILED", "DELETE_FAILED"].includes(value)) elements.phaseBadge.classList.add("failed");
    }

    function render(instance) {
      elements.emptyState.hidden = true;
      elements.instanceContent.hidden = false;
      elements.instanceId.textContent = instance.instance_id || state.instanceId || "-";
      elements.operationId.textContent = state.operationId || "-";
      elements.instanceTeam.textContent = instance.team_id || "-";
      elements.instanceChallenge.textContent = instance.challenge_id || "-";
      elements.instancePhase.textContent = instance.phase || "-";
      elements.instanceExpiry.textContent = instance.expires_at ? new Date(instance.expires_at).toLocaleString("ko-KR") : "-";
      elements.instanceEndpoint.textContent = instance.endpoint || "-";
      elements.instanceError.textContent = instance.last_error || "-";
      elements.errorRow.hidden = !instance.last_error;
      elements.openChallenge.hidden = instance.phase !== "READY" || !instance.endpoint;
      elements.openChallenge.href = instance.endpoint || "#";
      elements.deleteButton.disabled = state.busy || instance.phase === "TERMINATED";
      setPhase(instance.phase);
    }

    async function refreshInstance(silent = false) {
      if (!state.instanceId) return null;
      try {
        const instance = await api(`/internal/v1/instances/${encodeURIComponent(state.instanceId)}`);
        render(instance);
        if (!silent) log(`인스턴스 조회 · ${instance.phase}`, "ok");
        return instance;
      } catch (error) {
        if (!silent) log(`조회 실패 · ${error.message}`, "error");
        throw error;
      }
    }

    async function waitForOperation(operationId) {
      for (let attempt = 0; attempt < 80; attempt += 1) {
        const operation = await api(`/internal/v1/operations/${encodeURIComponent(operationId)}`);
        elements.operationId.textContent = operation.operation_id;
        if (operation.status === "SUCCEEDED") return operation;
        if (operation.status === "FAILED") throw new Error(operation.last_error || "작업이 실패했습니다.");
        await new Promise((resolve) => setTimeout(resolve, 350));
      }
      throw new Error("작업 확인 시간이 초과됐습니다.");
    }

    elements.createForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setBusy(true);
      const instanceId = id("inst-ui");
      const request = {
        request_id: id("req-create"),
        instance_id: instanceId,
        team_id: Number(elements.teamId.value),
        challenge_id: elements.challengeId.value,
        cluster_id: "k3s-local",
        reservation_id: "rsv-local",
        created_by: "local-dashboard",
        expires_at: new Date(Date.now() + Number(elements.ttlMinutes.value) * 60_000).toISOString()
      };

      try {
        log(`POST /instances · ${instanceId}`);
        const accepted = await api("/internal/v1/instances", { method: "POST", body: JSON.stringify(request) });
        state.instanceId = accepted.instance_id;
        state.operationId = accepted.operation_id;
        localStorage.setItem("provisioner.instanceId", state.instanceId);
        render({ instance_id: state.instanceId, team_id: request.team_id, challenge_id: request.challenge_id, phase: accepted.phase, expires_at: request.expires_at });
        log(`생성 접수 · ${accepted.operation_id}`, "ok");
        await waitForOperation(accepted.operation_id);
        const instance = await refreshInstance(true);
        log(`생성 완료 · ${instance.endpoint}`, "ok");
      } catch (error) {
        log(`생성 실패 · ${error.message}`, "error");
        await refreshInstance(true).catch(() => {});
      } finally {
        setBusy(false);
      }
    });

    elements.deleteButton.addEventListener("click", async () => {
      if (!state.instanceId || state.busy) return;
      setBusy(true);
      try {
        log(`DELETE /instances/${state.instanceId}`);
        const accepted = await api(`/internal/v1/instances/${encodeURIComponent(state.instanceId)}`, {
          method: "DELETE",
          body: JSON.stringify({ request_id: id("req-delete") })
        });
        state.operationId = accepted.operation_id;
        setPhase(accepted.phase);
        log(`삭제 접수 · ${accepted.operation_id}`, "ok");
        await waitForOperation(accepted.operation_id);
        const instance = await refreshInstance(true);
        log(`삭제 완료 · ${instance.phase}`, "ok");
        localStorage.removeItem("provisioner.instanceId");
      } catch (error) {
        log(`삭제 실패 · ${error.message}`, "error");
        await refreshInstance(true).catch(() => {});
      } finally {
        setBusy(false);
      }
    });

    elements.refreshButton.addEventListener("click", () => refreshInstance().catch(() => {}));
    elements.clearLogButton.addEventListener("click", () => { elements.activityLog.innerHTML = '<span class="time">대기 중</span>'; });

    async function bootstrap() {
      try {
        await api("/health/ready");
        elements.apiHealth.textContent = "READY";
        elements.apiHealth.style.color = "var(--success)";
      } catch {
        elements.apiHealth.textContent = "UNAVAILABLE";
        elements.apiHealth.style.color = "var(--danger)";
      }

      if (state.instanceId) {
        await refreshInstance(true).catch(() => {
          localStorage.removeItem("provisioner.instanceId");
          state.instanceId = "";
        });
      }
    }

    bootstrap();
  </script>
</body>
</html>
